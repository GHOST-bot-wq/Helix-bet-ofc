<!DOCTYPE html><html lang="pt-BR"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff0f0">
  <meta property="og:title" content="Helix Jump">
  <title>Helix Jump</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23FFE66D' stroke='%23FF6B6B' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      background: #090812;
    }

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      background: radial-gradient(circle at 50% 30%, #1a102f 0%, #090812 100%) !important;
      opacity: 1 !important;
    }

    #game-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent !important;
      opacity: 1 !important;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #start-screen {
      display: none !important;
    }

    #score {
      position: absolute;
      top: 20px;
      top: calc(20px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      font-size: 64px;
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    #idle-hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: rgba(255, 255, 255, 0.65);
      display: none;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    #idle-hint.visible {
      display: block;
      animation: blink-hint 1.5s ease-in-out infinite;
    }

    @keyframes blink-hint {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    #combo {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: 800;
      color: #FF007A;
      text-shadow: 0 0 12px rgba(255,0,122,0.6);
      display: none;
      pointer-events: none;
    }

    #combo.visible {
      display: block;
    }

    #points-popup {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 38px;
      font-weight: bold;
      color: #00E676;
      text-shadow: 0 0 10px rgba(0,230,118,0.6);
      pointer-events: none;
      opacity: 0;
      display: none;
    }

    #points-popup.visible {
      display: block;
    }

    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      display: none;
      pointer-events: none;
      background: rgba(18, 12, 38, 0.96);
      padding: 36px 52px;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #game-over.visible {
      display: block;
      pointer-events: auto;
    }

    #game-over h2 {
      margin-bottom: 16px;
      color: #fff;
      font-size: 30px;
    }

    #game-over p {
      margin-bottom: 8px;
      color: #ccc;
      font-size: 18px;
    }

    #game-over .restart-btn {
      margin-top: 24px;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #FF007A, #7928CA);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      transition: opacity 0.2s, transform 0.2s;
    }

    #game-over .restart-btn:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }
  </style>

  <script>
    window.addEventListener('error', function(e) {
      console.error('[Helix 3D Error]', e.message, e.filename, e.lineno, e.error);
    });
  </script>
  <script src="js/index-O5Ori94R.js?v=2.2.0"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>
    <div id="ui-overlay">
      <div id="start-screen" style="display: none !important;">
        <p>Toque para jogar</p>
        <span class="arrow">↓</span>
      </div>
      <div id="score">0</div>
      <div id="idle-hint">← Arraste →</div>
      <div id="combo">2x combo!</div>
      <div id="points-popup">+100!</div>
      <div id="game-over">
        <h2>Game Over</h2>
        <p>Score: <span id="final-score">0</span></p>
        <p>Recorde: <span id="record">0</span></p>
        <button class="restart-btn">Jogar Novamente</button>
      </div>
    </div>
  </div>


</body></html>
